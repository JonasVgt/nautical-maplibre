layer:
  id: "metadata_beacon_buoy"
  description: |
      All the metadata of beacons and buoys in OSM
  fields:
    class: The general type of beacon / buoy
    subclass: The subtype of beacon / buoy
    shape: The shape of the beacon / buoy
    pattern: The colorpattern of the beacon / buoy
    colour: The color of the beacon / buoy
    topmark_shape: The shape of the topmark
    topmark_pattern: The colorpattern of the topmark
    topmark_colour: The color of the topmark
datasources:
  - type: imposm3
    mapping_file: ./mapping.yaml
